[project]
name = "gestor-de-stock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adnan Infad", email = "infadadnan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
gestor-de-stock = "gestor_de_stock:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "ruff>=0.16.4",
]
[tool.pytest_env]
DATABASE_PATH = "test_inventory.db"
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "RET"]
